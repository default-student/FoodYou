name: Sync upstream and publish Food You Fork

on:
  push:
    branches: [main]
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

concurrency:
  group: foodyou-fork-release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the triggering source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Integrate the latest stable upstream release
        id: upstream
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/maksimowiczm/FoodYou.git
          git fetch upstream '+refs/tags/*:refs/tags/upstream/*'
          baseline="$(tr -d '\r\n' < .github/upstream-release-tag)"
          latest_tag="$(git for-each-ref --format='%(refname:strip=3)' refs/tags/upstream \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)"
          [[ -n "$latest_tag" ]] || { echo 'No stable upstream release tags were found.' >&2; exit 1; }
          if [[ "$(printf '%s\n%s\n' "$baseline" "$latest_tag" | sort -V | tail -n 1)" == "$baseline" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "Upstream is current at ${baseline}."
            exit 0
          fi

          upstream_sha="$(git rev-parse "refs/tags/upstream/${latest_tag}^{commit}")"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # A conflict stops this run before the baseline or fork branch changes.
          git merge --no-edit "$upstream_sha"
          printf '%s\n' "$latest_tag" > .github/upstream-release-tag
          git add .github/upstream-release-tag
          git commit -m "chore: integrate upstream release ${latest_tag}"
          git push origin HEAD:refs/heads/main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo "Integrated upstream ${latest_tag}."

      - name: Resolve whether a fork release is needed
        id: release
        if: github.event_name != 'schedule' || steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'push' ]]; then
            branch_sha="$(git ls-remote origin refs/heads/main | awk 'NR == 1 {print $1}')"
            if [[ -n "$branch_sha" && "$branch_sha" != "$(git rev-parse HEAD)" ]] \
              && git merge-base --is-ancestor HEAD "$branch_sha"; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              echo 'A newer fork commit supersedes this push.'
              exit 0
            fi
          fi

          source_sha="$(git rev-parse HEAD)"
          existing="$(SOURCE_SHA="$source_sha" gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select((.body // "") | contains("Fork source commit: `" + env.SOURCE_SHA + "`")) | .tag_name')"
          if [[ -n "$existing" ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "Source commit ${source_sha} already has a fork release."
            exit 0
          fi

          base_version="$(sed -n 's/^version-name = "\([0-9][0-9.]*\)"$/\1/p' gradle/libs.versions.toml | head -n 1)"
          base_code="$(sed -n 's/^android-versionCode = "\([0-9][0-9]*\)"$/\1/p' gradle/libs.versions.toml | head -n 1)"
          [[ -n "$base_version" && -n "$base_code" ]] || {
            echo 'Could not read the upstream version name or Android version code.' >&2
            exit 1
          }
          [[ "$GITHUB_RUN_NUMBER" -le 99999 ]] || {
            echo 'Fork workflow run number exceeded the reserved version-code range.' >&2
            exit 1
          }
          version_code="$((base_code * 100000 + GITHUB_RUN_NUMBER))"
          (( version_code <= 2100000000 )) || {
            echo "Version code ${version_code} exceeds Android's supported limit." >&2
            exit 1
          }
          version_name="${base_version}-fork.${GITHUB_RUN_NUMBER}"
          release_tag="v${version_name}"
          printf 'build=true\nversion_name=%s\nversion_code=%s\nrelease_tag=%s\nsource_sha=%s\n' \
            "$version_name" "$version_code" "$release_tag" "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'Release %s from %s\n' "$release_tag" "$source_sha"

      - name: Set up the Android build
        if: steps.release.outputs.build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        if: steps.release.outputs.build == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        if: steps.release.outputs.build == 'true'
        run: |
          sdkmanager 'build-tools;36.0.0'
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Decode fork signing key
        if: steps.release.outputs.build == 'true'
        env:
          FOODYOU_KEYSTORE_BASE64: ${{ secrets.FOODYOU_KEYSTORE_BASE64 }}
          FOODYOU_KEYSTORE_PASSWORD: ${{ secrets.FOODYOU_KEYSTORE_PASSWORD }}
          FOODYOU_KEY_PASSWORD: ${{ secrets.FOODYOU_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FOODYOU_KEYSTORE_BASE64:?Missing FOODYOU_KEYSTORE_BASE64 secret}"
          : "${FOODYOU_KEYSTORE_PASSWORD:?Missing FOODYOU_KEYSTORE_PASSWORD secret}"
          : "${FOODYOU_KEY_PASSWORD:?Missing FOODYOU_KEY_PASSWORD secret}"
          printf '%s' "$FOODYOU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/foodyou-fork-release.jks"
          chmod 600 "$RUNNER_TEMP/foodyou-fork-release.jks"

      - name: Build release APK
        if: steps.release.outputs.build == 'true'
        env:
          FORK_VERSION_NAME: ${{ steps.release.outputs.version_name }}
          FORK_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: >-
          ./gradlew --no-daemon assembleRelease
          -PforkVersionName="$FORK_VERSION_NAME"
          -PforkVersionCode="$FORK_VERSION_CODE"

      - name: Align, sign, and verify APK
        if: steps.release.outputs.build == 'true'
        env:
          FOODYOU_KEYSTORE_PASSWORD: ${{ secrets.FOODYOU_KEYSTORE_PASSWORD }}
          FOODYOU_KEY_PASSWORD: ${{ secrets.FOODYOU_KEY_PASSWORD }}
          EXPECTED_VERSION_CODE: ${{ steps.release.outputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          unsigned_apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          [[ -f "$unsigned_apk" ]] || { echo 'The release APK was not produced.' >&2; exit 1; }
          zipalign -f -p 4 "$unsigned_apk" "$RUNNER_TEMP/foodyou-aligned.apk"
          apksigner sign \
            --ks "$RUNNER_TEMP/foodyou-fork-release.jks" \
            --ks-key-alias foodyou-fork-release \
            --ks-pass env:FOODYOU_KEYSTORE_PASSWORD \
            --key-pass env:FOODYOU_KEY_PASSWORD \
            --out "$RUNNER_TEMP/foodyou-fork.apk" \
            "$RUNNER_TEMP/foodyou-aligned.apk"
          aapt dump badging "$RUNNER_TEMP/foodyou-fork.apk" > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.defaultstudent.foodyou'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionCode='${EXPECTED_VERSION_CODE}'" "$RUNNER_TEMP/apk-badging.txt"
          apksigner verify --verbose "$RUNNER_TEMP/foodyou-fork.apk"

      - name: Prepare fork release notes
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(tr -d '\r\n' < .github/upstream-release-tag)"
          upstream_body="$(gh api "repos/maksimowiczm/FoodYou/releases/tags/${baseline}" --jq '.body // "No upstream release notes were published."' 2>/dev/null \
            || printf 'No upstream release notes were published for %s.\n' "$baseline")"
          {
            printf 'Unofficial Food You fork based on upstream %s.\n\n' "$baseline"
            printf '%s\n\n' "$upstream_body"
            printf 'Fork source commit: `%s`\n' "$SOURCE_SHA"
            printf 'Package ID: `com.defaultstudent.foodyou`; this APK is signed with the fork-specific key.\n'
            printf 'Source: https://github.com/maksimowiczm/FoodYou/tree/%s\n' "$baseline"
          } > "$RUNNER_TEMP/foodyou-release-notes.md"

      - name: Publish fork APK release
        if: steps.release.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION_NAME: ${{ steps.release.outputs.version_name }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "Food You Fork ${VERSION_NAME}" \
              --notes-file "$RUNNER_TEMP/foodyou-release-notes.md"
          else
            gh release create "$RELEASE_TAG" \
              --title "Food You Fork ${VERSION_NAME}" \
              --notes-file "$RUNNER_TEMP/foodyou-release-notes.md" \
              --target "$SOURCE_SHA"
          fi
          cp "$RUNNER_TEMP/foodyou-fork.apk" "$RUNNER_TEMP/app-release.apk"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/app-release.apk" --clobber
